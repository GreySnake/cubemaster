name: Continuous Deployment (CD)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
          - Android
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore Unity Library Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-build-${{ matrix.targetPlatform }}-
            Library-

      - name: Build Unity Standalone Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: CubeMaster
          buildsPath: build

      - name: Package Build Artifacts (ZIP)
        run: |
          cd build/${{ matrix.targetPlatform }}
          zip -r ../CubeMaster-${{ matrix.targetPlatform }}.zip .

      - name: Upload Build Artifact to Run
        uses: actions/upload-artifact@v4
        with:
          name: CubeMaster-${{ matrix.targetPlatform }}
          path: build/CubeMaster-${{ matrix.targetPlatform }}.zip
          retention-days: 7

  publish-release:
    name: Publish Release Artifacts
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
